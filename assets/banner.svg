<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#0d1117" />
    </linearGradient>
    
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="50%" stop-color="#ec4899" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>

    <linearGradient id="accentCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <linearGradient id="pillGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#1d4ed8" stop-opacity="0.1" />
    </linearGradient>

    <!-- Glowing filters -->
    <filter id="glowGold" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="glowNeon" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Grid Pattern -->
    <pattern id="cyberGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1f2937" stroke-width="0.8" opacity="0.4" />
    </pattern>

    <!-- Keyframe Animations -->
    <style>
      .orb-pulse-1 {
        animation: float1 7s ease-in-out infinite alternate;
      }
      .orb-pulse-2 {
        animation: float2 9s ease-in-out infinite alternate;
      }
      .trophy-bounce {
        animation: bounce 4s ease-in-out infinite alternate;
        transform-origin: 980px 170px;
      }
      .bar-grow-1 {
        animation: pulseBar1 3s ease-in-out infinite alternate;
        transform-origin: bottom;
      }
      .bar-grow-2 {
        animation: pulseBar2 3.6s ease-in-out infinite alternate;
        transform-origin: bottom;
      }
      .bar-grow-3 {
        animation: pulseBar3 3.2s ease-in-out infinite alternate;
        transform-origin: bottom;
      }
      .shimmer-badge {
        animation: badgeShimmer 4s ease-in-out infinite;
      }

      @keyframes float1 {
        0% { transform: translate(0px, 0px) scale(1); }
        100% { transform: translate(30px, -20px) scale(1.15); }
      }
      @keyframes float2 {
        0% { transform: translate(0px, 0px) scale(1); }
        100% { transform: translate(-40px, 25px) scale(1.2); }
      }
      @keyframes bounce {
        0% { transform: translateY(0px) rotate(0deg); }
        100% { transform: translateY(-12px) rotate(3deg); }
      }
      @keyframes pulseBar1 {
        0% { height: 70px; y: 220px; }
        100% { height: 95px; y: 195px; }
      }
      @keyframes pulseBar2 {
        0% { height: 110px; y: 180px; }
        100% { height: 140px; y: 150px; }
      }
      @keyframes pulseBar3 {
        0% { height: 85px; y: 205px; }
        100% { height: 115px; y: 175px; }
      }
      @keyframes badgeShimmer {
        0%, 100% { opacity: 0.85; filter: drop-shadow(0 0 4px rgba(245, 158, 11, 0.4)); }
        50% { opacity: 1; filter: drop-shadow(0 0 16px rgba(245, 158, 11, 0.9)); }
      }
    </style>
  </defs>

  <!-- Canvas Background -->
  <rect width="1200" height="420" fill="url(#bgGrad)" />
  <rect width="1200" height="420" fill="url(#cyberGrid)" />

  <!-- Background Dynamic Glowing Orbs (Deep behind everything) -->
  <g opacity="0.35">
    <circle class="orb-pulse-1" cx="200" cy="100" r="140" fill="#8b5cf6" filter="url(#glowNeon)" />
    <circle class="orb-pulse-2" cx="1020" cy="140" r="160" fill="#ec4899" filter="url(#glowNeon)" />
    <circle class="orb-pulse-1" cx="620" cy="340" r="130" fill="#06b6d4" filter="url(#glowNeon)" />
  </g>

  <!-- Decorative Right Side Gamification & Leaderboard Visuals -->
  <g transform="translate(80, 0)">
    <!-- Leaderboard Card Container -->
    <rect x="780" y="80" width="280" height="250" rx="16" fill="#131d31" fill-opacity="0.75" stroke="#374151" stroke-width="1.5" />
    <rect x="780" y="80" width="280" height="40" rx="16" fill="#1f2937" fill-opacity="0.8" />
    <circle cx="804" cy="100" r="6" fill="#ef4444" />
    <circle cx="822" cy="100" r="6" fill="#f59e0b" />
    <circle cx="840" cy="100" r="6" fill="#10b981" />
    <text x="860" y="105" fill="#9ca3af" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">LIVE SALES CONTEST</text>

    <!-- Leaderboard Podium Graphic -->
    <!-- Rank 2 Podium & Bar -->
    <rect class="bar-grow-1" x="815" y="210" width="55" height="80" rx="6" fill="url(#accentCyan)" opacity="0.9" />
    <text x="842" y="245" fill="#ffffff" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">#2</text>
    <text x="842" y="200" fill="#93c5fd" font-family="sans-serif" font-size="11" font-weight="600" text-anchor="middle">12.8k XP</text>

    <!-- Rank 1 (Center Champion) Podium & Bar -->
    <rect class="bar-grow-2" x="890" y="170" width="60" height="120" rx="6" fill="url(#primaryGrad)" opacity="0.95" />
    <text x="920" y="215" fill="#ffffff" font-family="sans-serif" font-size="16" font-weight="bold" text-anchor="middle">#1</text>
    <text x="920" y="155" fill="#fde047" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">24.5k XP</text>

    <!-- Rank 3 Podium & Bar -->
    <rect class="bar-grow-3" x="970" y="225" width="55" height="65" rx="6" fill="#6366f1" opacity="0.85" />
    <text x="997" y="255" fill="#ffffff" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">#3</text>
    <text x="997" y="215" fill="#c7d2fe" font-family="sans-serif" font-size="11" font-weight="600" text-anchor="middle">9.4k XP</text>

    <!-- Base line for Podium -->
    <line x1="800" y1="290" x2="1040" y2="290" stroke="#4b5563" stroke-width="2" stroke-dasharray="4 4" />

    <!-- Animated Trophy Icon Floating above Rank 1 -->
    <g class="trophy-bounce shimmer-badge">
      <circle cx="920" cy="115" r="22" fill="#1e293b" stroke="#f59e0b" stroke-width="2" />
      <!-- Trophy SVG path -->
      <path d="M 911 106 L 929 106 C 929 116 924 122 920 123 C 916 122 911 116 911 106 Z M 908 108 C 905 108 905 114 911 115 M 932 108 C 935 108 935 114 929 115 M 917 123 L 923 123 L 923 127 L 917 127 Z M 914 127 L 926 127 L 926 129 L 914 129 Z" fill="none" stroke="#f59e0b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
      <polygon points="920,109 921.5,113 925.5,113 922.5,115.5 923.5,119.5 920,117 916.5,119.5 917.5,115.5 914.5,113 918.5,113" fill="#f59e0b" />
    </g>
  </g>

  <!-- FOREGROUND: Content Area (Fixed in crisp, clear foreground) -->
  <g transform="translate(80, 0)">
    
    <!-- Category Pill Badge -->
    <g transform="translate(0, 68)">
      <rect x="0" y="0" width="285" height="32" rx="16" fill="url(#pillGrad1)" stroke="#3b82f6" stroke-width="1.2" />
      <circle cx="16" cy="16" r="5" fill="#10b981" />
      <text x="30" y="21" fill="#93c5fd" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" letter-spacing="0.8">ENTERPRISE SALES MOTIVATION</text>
    </g>

    <!-- Main Title (Gradient + High Contrast Glow) -->
    <text x="0" y="148" fill="url(#primaryGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="900" letter-spacing="-0.5">
      Awesome Gamification
    </text>
    <text x="0" y="194" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="36" font-weight="800" letter-spacing="-0.5">
      &amp; Sales Motivation 🚀
    </text>

    <!-- Subtitle / Tagline -->
    <text x="0" y="235" fill="#9ca3af" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="500">
      Curated directory of SaaS platforms, tournament brackets &amp; open-source engines
    </text>
    <text x="0" y="260" fill="#6b7280" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="400">
      Real-Time Leaderboards • Point &amp; Badge Systems • Head-to-Head Contests • Data Sovereignty
    </text>

    <!-- Feature Pills in Foreground -->
    <g transform="translate(0, 295)">
      <!-- Pill 1 -->
      <rect x="0" y="0" width="145" height="34" rx="8" fill="#1f2937" stroke="#374151" stroke-width="1.2" />
      <text x="72" y="22" fill="#f3f4f6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" text-anchor="middle">🏆 Sales Contests</text>

      <!-- Pill 2 -->
      <rect x="155" y="0" width="145" height="34" rx="8" fill="#1f2937" stroke="#374151" stroke-width="1.2" />
      <text x="227" y="22" fill="#f3f4f6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" text-anchor="middle">📊 Leaderboards</text>

      <!-- Pill 3 -->
      <rect x="310" y="0" width="165" height="34" rx="8" fill="#1f2937" stroke="#374151" stroke-width="1.2" />
      <text x="392" y="22" fill="#f3f4f6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" text-anchor="middle">⚡ Self-Hosted Engines</text>

      <!-- Pill 4 -->
      <rect x="485" y="0" width="150" height="34" rx="8" fill="#1f2937" stroke="#374151" stroke-width="1.2" />
      <text x="560" y="22" fill="#f3f4f6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" text-anchor="middle">🎯 Quota &amp; Spiffs</text>
    </g>

  </g>

  <!-- Bottom Accent Line -->
  <rect x="0" y="415" width="1200" height="5" fill="url(#primaryGrad)" />
</svg>
